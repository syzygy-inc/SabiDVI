name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 純 Rust: 参照環境が無い case は BLOCKED として台帳に残り、skip される
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Ledger without the reference environment (no oracle case may PASS)
        run: |
          sh scripts/qa-ledger.sh || true
          if grep -h $'\tPASS\t' target/qa-ledger/*.tsv; then echo "oracle cases must not PASS without TeX Live"; exit 1; fi
      - name: Strict mode must fail without the reference environment (deliberate failure is detected)
        run: |
          rm -rf target/qa-ledger
          if SABI_STRICT_TESTS=1 cargo test --workspace >/dev/null 2>&1; then echo "strict mode passed without TeX Live"; exit 1; fi
          echo "strict mode failed as expected"
      - name: Build wasm
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release -p sabidvi-wasm --target wasm32-unknown-unknown
          ls -la target/wasm32-unknown-unknown/release/sabidvi_wasm.wasm

  # 参照環境あり: 中核（tex / etex / dvipdfmx / PGF / Computer Modern）は必須、追加のエンジン・フォントは任意
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install TeX Live (core)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-binaries texlive-base texlive-fonts-recommended texlive-pictures
      - name: Install optional engines and fonts
        continue-on-error: true
        run: sudo apt-get install -y --no-install-recommends texlive-lang-japanese fonts-haranoaji fonts-lmodern
      - name: Diagnose the reference environment
        run: |
          for t in tex etex uptex xetex dvipdfmx kpsewhich; do printf '%s: ' "$t"; which "$t" || echo "(missing)"; done
          for f in cmr10.tfm cmr10.pfb utmr8a.pfb ptmr7t.vf lmroman10-regular.otf uprml-h.tfm upjisr-h.tfm HaranoAjiMincho-Regular.otf; do printf '%s: ' "$f"; kpsewhich "$f" || echo "(missing)"; done
      - name: Test (strict for the core environment)
        env:
          SABI_STRICT_TESTS: "1"
        run: |
          rm -rf target/qa-ledger
          cargo test --workspace
      - name: Ledger (all required cases PASS; optional cases listed)
        run: sh scripts/qa-ledger.sh
